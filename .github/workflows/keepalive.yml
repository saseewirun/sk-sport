name: Supabase keepalive

# Pings the deployed /api/health endpoint on a schedule so the free-tier
# Supabase project keeps seeing database activity and does not get paused.
#
# Setup: add a repository secret KEEPALIVE_URL pointing at the health endpoint,
# e.g. https://sksporttrading.com/api/health
#
# Schedule note: day-of-month "*/5" fires on days 1,6,11,16,21,26 (and resets
# each month), so the gap between pings stays at or below ~5 days — well within
# Supabase's 7-day inactivity window. Also runnable manually via the Actions tab.

on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "::error::Repository secret KEEPALIVE_URL is not set."
            exit 1
          fi
          echo "Pinging $KEEPALIVE_URL"
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 "$KEEPALIVE_URL" || true)
          echo "HTTP status: $code"
          echo "Response body:"
          cat /tmp/health.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Keepalive failed (HTTP $code)"
            exit 1
          fi
          echo "Keepalive OK"
